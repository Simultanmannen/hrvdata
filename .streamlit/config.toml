[global]
# Paketen ligger utanför site-packages, vilket annars får Streamlit att tro att det är utvecklarläge
developmentMode = false

[logger]
level = "error"

[server]
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Modernt tema: ljusgrå sida, vita kort, indigo accent
[theme]
base = "light"
primaryColor = "#5B5BD6"
backgroundColor = "#F5F6F8"
secondaryBackgroundColor = "#E9EAF0"
textColor = "#111827"
font = "sans serif"
baseRadius = "large"
borderColor = "#E5E7EB"
showWidgetBorder = false

[theme.sidebar]
backgroundColor = "#FFFFFF"